# Follow-up messages in Hindi, code-mixed where patients use English words. Fixed text only: no model writes
# these. DRAFT by the assistant, pending a native speaker's review (reviewed_by stays null until then).
language: hi-IN
reviewed_by: null
disclosure: 'नमस्ते {patient}। मैं {clinic} में {doctor} का AI सहायक हूँ। यह मैसेज {date} की आपकी जाँच के बारे में है।'
summary_intro: 'डॉक्टर ने आपकी दवाइयाँ इस तरह लिखी हैं:'
keywords_help: 'डॉक्टर से बात करनी हो तो DOCTOR लिखें। मैसेज बंद करने के लिए STOP लिखें।'
questions:
  tolerance: 'नई दवा से कोई दिक्कत तो नहीं हो रही?'
  symptom_status: 'अब आप कैसा महसूस कर रहे हैं?'
  adherence: 'क्या आप दवाइयाँ समय पर ले रहे हैं?'
  review_attendance: '{date} को दोबारा दिखाने आ पाएँगे?'
  side_effect_detail: 'क्या दिक्कत हो रही है? लिखकर बताइए।'
buttons:
  no_problem: 'कोई दिक्कत नहीं'
  some_problem: 'कुछ दिक्कत है'
  stopped: 'दवा बंद कर दी'
  better: 'बेहतर हूँ'
  same: 'वैसा ही'
  worse: 'ज़्यादा खराब'
  taking_all: 'सब ले रहा/रही हूँ'
  missed_some: 'कुछ छूट गईं'
  'yes': 'हाँ, आऊँगा/आऊँगी'
  need_another_day: 'दूसरा दिन चाहिए'
  stop_yes: 'हाँ, बंद करें'
  stop_no: 'नहीं, जारी रखें'
replies:
  thanks: 'धन्यवाद। मैंने यह {doctor} के रिकॉर्ड में जोड़ दिया है।'
  answer_prefix: 'आपकी पर्ची के अनुसार:'
  answer_suffix: 'और कुछ पूछना हो तो DOCTOR लिखें।'
  escalated: 'यह सवाल मैंने {doctor} को भेज दिया है। क्लिनिक आपसे संपर्क करेगा।'
  worse: 'मैंने {doctor} को बता दिया है, क्लिनिक आपसे संपर्क करेगा। साँस फूलना, सीने में दर्द या बेहोशी हो तो तुरंत नज़दीकी इमरजेंसी जाएँ या 108 पर कॉल करें।'
  stopped_medicine: 'कृपया डॉक्टर से पूछे बिना दवा न बदलें। मैंने {doctor} को बता दिया है, क्लिनिक आपसे संपर्क करेगा।'
  side_effect_noted: 'धन्यवाद। मैंने यह {doctor} को भेज दिया है, क्लिनिक आपसे संपर्क करेगा।'
  urgent: 'यह गंभीर हो सकता है। तुरंत नज़दीकी इमरजेंसी में जाएँ या 108 पर कॉल करें। मैंने {doctor} को भी सूचित कर दिया है।'
  callback: 'ठीक है, मैंने क्लिनिक को बता दिया है। वे आपको कॉल करेंगे।'
  consult: 'मैंने नई अपॉइंटमेंट का अनुरोध क्लिनिक को भेज दिया है। वे आपसे समय तय करेंगे।'
  reschedule: 'ठीक है, मैंने क्लिनिक को बता दिया है। वे आपसे नया समय तय करेंगे।'
  clarify: 'माफ़ कीजिए, मैं समझ नहीं पाया। कृपया नीचे से चुनें, या DOCTOR लिखें।'
  not_heard: 'माफ़ कीजिए, आपकी आवाज़ साफ़ सुनाई नहीं दी। कृपया लिखकर भेजें या दोबारा बोलें।'
  stop_confirmed: 'ठीक है, अब आपको फ़ॉलो-अप मैसेज नहीं भेजे जाएँगे। ज़रूरत हो तो सीधे क्लिनिक से संपर्क करें।'
  voice_failed: 'माफ़ कीजिए, यह वॉइस नोट नहीं चल पाया। कृपया 30 सेकंड से छोटा वॉइस नोट भेजें, या लिखकर भेजें।'
  greeting: 'नमस्ते! मैं {doctor} का AI सहायक हूँ। आप अपनी दवाइयों के बारे में पूछ सकते हैं, बता सकते हैं कि कैसा महसूस कर रहे हैं, या रिपोर्ट भेज सकते हैं। क्लिनिक से बात करने के लिए DOCTOR लिखें।'
  stop_confirm: 'क्या आप फ़ॉलो-अप मैसेज बंद करना चाहते हैं?'
  stop_cancelled: 'ठीक है, आपके फ़ॉलो-अप मैसेज जारी रहेंगे।'
  upload_hint: 'अपनी रिपोर्ट यहाँ PDF या साफ़ फ़ोटो के रूप में भेजें। मैं इसे {doctor} के देखने के लिए सेव कर दूँगा। (टेस्ट बॉट: सिर्फ़ सिंथेटिक रिपोर्ट भेजें।)'
  language_set: 'ठीक है, अब से मैं हिंदी में जवाब दूँगा।'
  language_unavailable: 'माफ़ कीजिए, अभी मैं सिर्फ़ हिंदी या अंग्रेज़ी में जवाब दे सकता हूँ।'
